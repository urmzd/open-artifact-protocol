<oap:target id="rustfmt-config"><oap:target id="version">1</oap:target>
<oap:target id="max-width">100</oap:target>
<oap:target id="hard-tabs">false</oap:target>
<oap:target id="tab-spaces">4</oap:target>
<oap:target id="newline-style">Unix</oap:target>
<oap:target id="indent-style">Block</oap:target>
<oap:target id="use-field-init-shorthand">true</oap:target>
<oap:target id="use-field-init-shorthand-force">true</oap:target>
<oap:target id="imports-granularity">Crate</oap:target>
<oap:target id="group-imports">StdExternalCrate</oap:target>
<oap:target id="reorder-imports">true</oap:target>
<oap:target id="reorder-modules">true</oap:target>
<oap:target id="edition">2021</oap:target>
<oap:target id="wrap-comments">true</oap:target>
<oap:target id="format-code-in-doc-comments">true</oap:target>
<oap:target id="normalize-doc-attributes">true</oap:target>
<oap:target id="comment-width">100</oap:target>
<oap:target id="fn-single-line">false</oap:target>
<oap:target id="where-single-line">true</oap:target>
<oap:target id="chain-width">80</oap:target>
<oap:target id="array-width">60</oap:target>
<oap:target id="struct-literal-width">18</oap:target>
<oap:target id="struct-field-align-threshold">20</oap:target>
<oap:target id="match-arm-blocks">true</oap:target>
<oap:target id="control-brace-style">AlwaysSameLine</oap:target>
<oap:target id="brace-style">SameLineWhere</oap:target>
<oap:target id="format-strings">true</oap:target>
<oap:target id="format-macros">true</oap:target>
<oap:target id="merge-derives">true</oap:target>
<oap:target id="use-small-heuristics">Max</oap:target>
<oap:target id="overflow-delimited-expr">true</oap:target>
<oap:target id="trailing-comma">Vertical</oap:target>
<oap:target id="blank-lines-upper-bound">1</oap:target>
<oap:target id="blank-lines-lower-bound">0</oap:target>
<oap:target id="blank-lines-single-hundred-percent">true</oap:target>
</oap:target>