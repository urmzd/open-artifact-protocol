<oap:target id="compose-document">
version: <oap:target id="compose-version">"3.9"</oap:target>

services:
  <oap:target id="api-gateway-service">
    <oap:target id="api-gateway-name">api-gateway</oap:target>:
    <oap:target id="api-gateway-image">image: nginx:1.27-alpine</oap:target>
    <oap:target id="api-gateway-ports">ports:
      - "80:80"</oap:target>
    <oap:target id="api-gateway-networks">networks:
      - <oap:target id="shared-network-name">app-network</oap:target></oap:target>
    <oap:target id="api-gateway-volumes">volumes:
      - <oap:target id="nginx-conf-volume">./nginx/nginx.conf:/etc/nginx/nginx.conf:ro</oap:target>    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M</oap:target>
    <oap:target id="api-gateway-healthcheck">healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: <oap:target id="api-gateway-health-interval">10s</oap:target>
      timeout: <oap:target id="api-gateway-health-timeout">5s</oap:target>
      retries: <oap:target id="api-gateway-health-retries">3</oap:target></oap:target>
    <oap:target id="api-gateway-depends-on">depends_on:
      <oap:target id="auth-service-dependency">auth-service</oap:target>:
        condition: service_healthy
      <oap:target id="user-service-dependency">user-service</oap:target>:
        condition: service_healthy
      <oap:target id="order-service-dependency">order-service</oap:target>:
        condition: service_healthy
      <oap:target id="notification-service-dependency">notification-service</oap:target>:
        condition: service_healthy</oap:target>
  </oap:target>

  <oap:target id="auth-service-block">
    <oap:target id="auth-service-name">auth-service</oap:target>:
    <oap:target id="auth-service-build">build:
      context: ./auth-service</oap:target>
    <oap:target id="auth-service-environment">environment:
      <oap:target id="jwt-secret-env">JWT_SECRET=${JWT_SECRET}</oap:target>
      <oap:target id="jwt-issuer-env">JWT_ISSUER=${JWT_ISSUER}</oap:target>
      <oap:target id="jwt-expiry-env">JWT_EXPIRY=${JWT_EXPIRY}</oap:target>
      <oap:target id="auth-port-env">PORT=${AUTH_PORT}</oap:target>
      <oap:target id="auth-db-url-env">DATABASE_URL=${AUTH_DATABASE_URL}</oap:target></oap:target>
    <oap:target id="auth-service-env-file">env_file:
      - <oap:target id="auth-env-file-path">./auth-service/.env</oap:target></oap:target>
    <oap:target id="auth-service-networks">networks:
      - <oap:target id="shared-network-name-2">app-network</oap:target></oap:target>
    <oap:target id="auth-service-healthcheck">healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_PORT}/health"]
      interval: <oap:target id="auth-health-interval">10s</oap:target>
      timeout: <oap:target id="auth-health-timeout">5s</oap:target>
      retries: <oap:target id="auth-health-retries">3</oap:target></oap:target>
    <oap:target id="auth-service-depends-on">depends_on:
      <oap:target id="postgres-dependency">postgres</oap:target>:
        condition: service_healthy    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M</oap:target>
  </oap:target>

  <oap:target id="user-service-block">
    <oap:target id="user-service-name">user-service</oap:target>:
    <oap:target id="user-service-build">build:
      context: ./user-service</oap:target>
    <oap:target id="user-service-environment">environment:
      <oap:target id="user-db-host-env">DB_HOST=${POSTGRES_HOST}</oap:target>
      <oap:target id="user-db-port-env">DB_PORT=${POSTGRES_PORT}</oap:target>
      <oap:target id="user-db-name-env">DB_NAME=${POSTGRES_DB}</oap:target>
      <oap:target id="user-db-user-env">DB_USER=${POSTGRES_USER}</oap:target>
      <oap:target id="user-db-password-env">DB_PASSWORD=${POSTGRES_PASSWORD}</oap:target>
      <oap:target id="user-port-env">PORT=${USER_PORT}</oap:target></oap:target>
    <oap:target id="user-service-env-file">env_file:
      - <oap:target id="user-env-file-path">./user-service/.env</oap:target></oap:target>
    <oap:target id="user-service-networks">networks:
      - <oap:target id="shared-network-name-3">app-network</oap:target></oap:target>
    <oap:target id="user-service-healthcheck">healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${USER_PORT}/health"]
      interval: <oap:target id="user-health-interval">10s</oap:target>
      timeout: <oap:target id="user-health-timeout">5s</oap:target>
      retries: <oap:target id="user-health-retries">3</oap:target></oap:target>
    <oap:target id="user-service-depends-on">depends_on:
      <oap:target id="postgres-dependency-2">postgres</oap:target>:
        condition: service_healthy    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M</oap:target>
  </oap:target>

  <oap:target id="order-service-block">
    <oap:target id="order-service-name">order-service</oap:target>:
    <oap:target id="order-service-build">build:
      context: ./order-service</oap:target>
    <oap:target id="order-service-environment">environment:
      <oap:target id="order-db-host-env">DB_HOST=${REDIS_HOST}</oap:target>
      <oap:target id="order-db-port-env">DB_PORT=${REDIS_PORT}</oap:target>
      <oap:target id="order-port-env">PORT=${ORDER_PORT}</oap:target></oap:target>
    <oap:target id="order-service-env-file">env_file:
      - <oap:target id="order-env-file-path">./order-service/.env</oap:target></oap:target>
    <oap:target id="order-service-networks">networks:
      - <oap:target id="shared-network-name-4">app-network</oap:target></oap:target>
    <oap:target id="order-service-healthcheck">healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${ORDER_PORT}/health"]
      interval: <oap:target id="order-health-interval">10s</oap:target>
      timeout: <oap:target id="order-health-timeout">5s</oap:target>
      retries: <oap:target id="order-health-retries">3</oap:target></oap:target>
    <oap:target id="order-service-depends-on">depends_on:
      <oap:target id="redis-dependency">redis</oap:target>:
        condition: service_healthy    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M</oap:target>
  </oap:target>

  <oap:target id="notification-service-block">
    <oap:target id="notification-service-name">notification-service</oap:target>:
    <oap:target id="notification-service-build">build:
      context: ./notification-service</oap:target>
    <oap:target id="notification-service-environment">environment:
      <oap:target id="rabbitmq-host-env">RABBITMQ_HOST=${RABBITMQ_HOST}</oap:target>
      <oap:target id="rabbitmq-port-env">RABBITMQ_PORT=${RABBITMQ_PORT}</oap:target>
      <oap:target id="notification-port-env">PORT=${NOTIFICATION_PORT}</oap:target></oap:target>
    <oap:target id="notification-service-env-file">env_file:
      - <oap:target id="notification-env-file-path">./notification-service/.env</oap:target></oap:target>
    <oap:target id="notification-service-networks">networks:
      - <oap:target id="shared-network-name-5">app-network</oap:target></oap:target>
    <oap:target id="notification-service-healthcheck">healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${NOTIFICATION_PORT}/health')"]
      interval: <oap:target id="notification-health-interval">10s</oap:target>
      timeout: <oap:target id="notification-health-timeout">5s</oap:target>
      retries: <oap:target id="notification-health-retries">3</oap:target></oap:target>
    <oap:target id="notification-service-depends-on">depends_on:
      <oap:target id="rabbitmq-dependency">rabbitmq</oap:target>:
        condition: service_healthy    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M</oap:target>
  </oap:target>

  <oap:target id="postgres-block">  <oap:target id="monitoring-service-block">
  <oap:target id="celery-worker-service-block">
    <oap:target id="celery-worker-service-name">celery-worker</oap:target>:
    <oap:target id="celery-worker-service-image">image: notification-service</oap:target>
    <oap:target id="celery-worker-service-command">command: celery -A app.celery worker --loglevel=info</oap:target>
    <oap:target id="celery-worker-service-env-file">env_file:
      - <oap:target id="celery-worker-env-file-path">./notification-service/.env</oap:target></oap:target>
    <oap:target id="celery-worker-service-networks">networks:
      - <oap:target id="shared-network-name-11">app-network</oap:target></oap:target>
  </oap:target>

    <oap:target id="monitoring-service-name">monitoring</oap:target>:
    <oap:target id="monitoring-service-image">image: prom/prometheus:latest</oap:target>
    <oap:target id="monitoring-service-ports">ports:
      - "9090:9090"</oap:target>
    <oap:target id="monitoring-service-volumes">volumes:
      - <oap:target id="monitoring-prometheus-config-volume">./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro</oap:target></oap:target>
    <oap:target id="monitoring-service-networks">networks:
      - <oap:target id="shared-network-name-10">app-network</oap:target></oap:target>
    <oap:target id="monitoring-service-depends-on">depends_on:
      <oap:target id="api-gateway-dependency">api-gateway</oap:target>:
        condition: service_started
      <oap:target id="auth-service-dependency-2">auth-service</oap:target>:
        condition: service_started
      <oap:target id="user-service-dependency-2">user-service</oap:target>:
        condition: service_started
      <oap:target id="order-service-dependency-2">order-service</oap:target>:
        condition: service_started
      <oap:target id="notification-service-dependency-2">notification-service</oap:target>:
        condition: service_started
      <oap:target id="postgres-dependency-3">postgres</oap:target>:
        condition: service_started
      <oap:target id="redis-dependency-2">redis</oap:target>:
        condition: service_started
      <oap:target id="rabbitmq-dependency-2">rabbitmq</oap:target>:
        condition: service_started</oap:target>
  </oap:target>

  <oap:target id="monitoring-prometheus-config-file">
    - content: ./monitoring/prometheus.yml
      scrape_configs:
        - job_name: api-gateway
          metrics_path: /metrics
          static_configs:
            - targets: ['api-gateway:80']
        - job_name: auth-service
          metrics_path: /metrics
          static_configs:
            - targets: ['auth-service:${AUTH_PORT}']
        - job_name: user-service
          metrics_path: /metrics
          static_configs:
            - targets: ['user-service:${USER_PORT}']
        - job_name: order-service
          metrics_path: /metrics
          static_configs:
            - targets: ['order-service:${ORDER_PORT}']
        - job_name: notification-service
          metrics_path: /metrics
          static_configs:
            - targets: ['notification-service:${NOTIFICATION_PORT}']
    <oap:target id="postgres-service-name">postgres</oap:target>:
    <oap:target id="postgres-image">image: postgres:16</oap:target>
    <oap:target id="postgres-environment">environment:
      <oap:target id="postgres-db-env">POSTGRES_DB=${POSTGRES_DB}</oap:target>
      <oap:target id="postgres-user-env">POSTGRES_USER=${POSTGRES_USER}</oap:target>
      <oap:target id="postgres-password-env">POSTGRES_PASSWORD=${POSTGRES_PASSWORD}</oap:target></oap:target>
    <oap:target id="postgres-volumes">volumes:
      - <oap:target id="postgres-data-volume">postgres_data:/var/lib/postgresql/data</oap:target>
      - <oap:target id="postgres-init-volume">./postgres/init:/docker-entrypoint-initdb.d:ro</oap:target></oap:target>
    <oap:target id="postgres-networks">networks:
      - <oap:target id="shared-network-name-6">app-network</oap:target></oap:target>
    <oap:target id="postgres-healthcheck">healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G</oap:target>
  </oap:target>

  <oap:target id="redis-block">
    <oap:target id="redis-service-name">redis</oap:target>:
    <oap:target id="redis-image">image: redis:7-alpine</oap:target>
    <oap:target id="redis-volumes">volumes:
      - <oap:target id="redis-data-volume">redis_data:/data</oap:target></oap:target>
    <oap:target id="redis-networks">networks:
      - <oap:target id="shared-network-name-7">app-network</oap:target></oap:target>
    <oap:target id="redis-healthcheck">healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: <oap:target id="redis-health-interval">10s</oap:target>
      timeout: <oap:target id="redis-health-timeout">5s</oap:target>
      retries: <oap:target id="redis-health-retries">5</oap:target>    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G</oap:target>
  </oap:target>

  <oap:target id="rabbitmq-block">
    <oap:target id="rabbitmq-service-name">rabbitmq</oap:target>:
    <oap:target id="rabbitmq-image">image: rabbitmq:3-management-alpine</oap:target>
    <oap:target id="rabbitmq-environment">environment:
      <oap:target id="rabbitmq-default-user-env">RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}</oap:target>
      <oap:target id="rabbitmq-default-pass-env">RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}</oap:target></oap:target>
    <oap:target id="rabbitmq-ports">ports:
      - "${RABBITMQ_MGMT_PORT}:15672"</oap:target>
    <oap:target id="rabbitmq-networks">networks:
      - <oap:target id="shared-network-name-8">app-network</oap:target></oap:target>
    <oap:target id="rabbitmq-healthcheck">healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: <oap:target id="rabbitmq-health-interval">10s</oap:target>
      timeout: <oap:target id="rabbitmq-health-timeout">5s</oap:target>
      retries: <oap:target id="rabbitmq-health-retries">5</oap:target>    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G</oap:target>
  </oap:target>

networks:
  <oap:target id="shared-network-block">
    <oap:target id="shared-network-name-9">app-network</oap:target>:
    <oap:target id="shared-network-driver">driver: bridge</oap:target>
  </oap:target>

volumes:
  <oap:target id="postgres-volume-block">
    <oap:target id="postgres-volume-name">postgres_data</oap:target>: {}
  </oap:target>
  <oap:target id="redis-volume-block">
    <oap:target id="redis-volume-name">redis_data</oap:target>: {}
  </oap:target>
</oap:target>